name: Recette Playwright - Authentification
on:
  workflow_dispatch:
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Tester les connexions
        run: npx playwright test tests/e2e/auth.spec.js
        env:
          TEST_CONTROLLER_CODE: ${{ secrets.TEST_CONTROLLER_CODE }}
          TEST_ADMIN_CODE: ${{ secrets.TEST_ADMIN_CODE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-authentification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
