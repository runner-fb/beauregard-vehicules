
name: Recette Playwright - Authentification

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Vérifier les secrets GitHub
        env:
          CONTROLLER: ${{ secrets.TEST_CONTROLLER_CODE }}
          ADMIN: ${{ secrets.TEST_ADMIN_CODE }}
        run: |
          if [ -z "$CONTROLLER" ]; then
            echo "::error::Secret TEST_CONTROLLER_CODE absent"
            exit 1
          fi

          if [ -z "$ADMIN" ]; then
            echo "::error::Secret TEST_ADMIN_CODE absent"
            exit 1
          fi

          echo "Les deux secrets sont présents."

      - name: Tester les connexions
        run: npx playwright test tests/e2e/auth.spec.js
        env:
          CI: true
          TEST_CONTROLLER_CODE: ${{ secrets.TEST_CONTROLLER_CODE }}
          TEST_ADMIN_CODE: ${{ secrets.TEST_ADMIN_CODE }}

      - name: Enregistrer les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-authentification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
