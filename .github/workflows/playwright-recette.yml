name: Recette Playwright Beauregard Vehicules
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-recette.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
